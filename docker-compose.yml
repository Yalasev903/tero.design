version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: app-tero-php
    container_name: app-tero-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - app-tero-net

  nginx:
    image: nginx:stable-alpine
    container_name: app-tero-nginx
    restart: unless-stopped
    ports:
      - "8000:80"       # локальная отладка
      - "80:80"         # HTTP (для certbot и редиректа)
      - "443:443"       # HTTPS (для Let's Encrypt)
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - app-tero-net

  db:
    image: mysql:8.0
    container_name: app-tero-mysql
    restart: unless-stopped
    ports:
      - "3309:3306"  # отличаемся от 3306 (основной сайт) и 3308 (ваш старый docker)
    environment:
      MYSQL_DATABASE: app_tero_db
      MYSQL_ROOT_PASSWORD: 7PzVasfLp43!gMyZ
    volumes:
      - app_tero_mysql_data:/var/lib/mysql
    networks:
      - app-tero-net

networks:
  app-tero-net:

volumes:
  app_tero_mysql_data:
