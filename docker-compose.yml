version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: tero-php
    container_name: tero-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - tero-net

  nginx:
    image: nginx:stable-alpine
    container_name: tero-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - tero-net

  db:
    image: mysql:8.0
    container_name: tero-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: tero_db
      MYSQL_ROOT_PASSWORD: simplepassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tero-net

networks:
  tero-net:

volumes:
  mysql_data:
